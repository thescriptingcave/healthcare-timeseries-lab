name: healthcare-timeseries-lab

services:
  kafka:
    image: confluentinc/cp-kafka:8.0.7
    container_name: htl-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.7
    container_name: htl-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/v1/metadata/id || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: htl-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  postgres-fhir:
    image: postgres:16
    container_name: htl-postgres-fhir
    environment:
      POSTGRES_DB: fhir
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: fhir
    ports:
      - "5433:5432"
    volumes:
      - pg_fhir_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir -d fhir"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-iceberg:
    image: postgres:16
    container_name: htl-postgres-iceberg
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    ports:
      - "5434:5432"
    volumes:
      - pg_iceberg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      timeout: 5s
      retries: 20

  hapi:
    image: hapiproject/hapi:v8.12.0-1
    container_name: htl-hapi
    depends_on:
      postgres-fhir:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-fhir:5432/fhir
      SPRING_DATASOURCE_USERNAME: fhir
      SPRING_DATASOURCE_PASSWORD: fhir
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    ports:
      - "8080:8080"
    # Note: hapiproject/hapi is a JRE-only image (no /bin/sh, no curl, no busybox),
    # so an in-container shell healthcheck cannot run. Health is instead verified
    # from the host by scripts/init_infra.py (polls /fhir/metadata).

  trino:
    build:
      context: ./infra/trino
    container_name: htl-trino
    depends_on:
      postgres-iceberg:
        condition: service_healthy
      postgres-fhir:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      - ./infra/trino/etc:/etc/trino:ro
    healthcheck:
      test: ["CMD-SHELL", "(exec 3<>/dev/tcp/localhost/8080) && exit 0 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

  mysql-clinical:
    image: mysql:8.0.42
    container_name: htl-mysql-clinical
    environment:
      MYSQL_ROOT_PASSWORD: clinical
      MYSQL_DATABASE: clinical
      MYSQL_USER: clinical
      MYSQL_PASSWORD: clinical
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_clinical_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  influxdb:
    image: influxdb:2.7
    container_name: htl-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-admin_password}
      DOCKER_INFLUXDB_INIT_ORG: healthcare
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${HTL_INFLUX_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - influxdb2_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "(exec 3<>/dev/tcp/localhost/8086) && exit 0 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  grafana:
    build:
      context: ./infra/grafana
    container_name: htl-grafana
    depends_on:
      trino:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "trino-datasource"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "(exec 3<>/dev/tcp/localhost/3000) && exit 0 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  superset:
    image: apache/superset:109402b
    container_name: htl-superset
    depends_on:
      trino:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-dev-key-123}
      SUPERSET__SQLALCHEMY_DATABASE_URI: sqlite:///superset.db
      SUPERSET_HOST: 0.0.0.0
    ports:
      - "8088:8088"
    volumes:
      - ./infra/superset:/app/superset:ro
    command: superset db upgrade
    healthcheck:
      test: ["CMD-SHELL", "(exec 3<>/dev/tcp/localhost/8088) && exit 0 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

volumes:
  kafka_data:
  minio_data:
  pg_fhir_data:
  pg_iceberg_data:
  influxdb2_data:
  mysql_clinical_data:
  superset_data: